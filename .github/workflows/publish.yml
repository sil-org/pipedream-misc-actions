name: Publish Pipedream Action
on:
  push:

jobs:
  check-import-versions:
    name: Check Import Versions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Check import version constraints match package.json
        run: |
          node --input-type=module - <<'EOF'
          import { readFileSync, readdirSync, statSync } from 'fs';
          import { join } from 'path';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const deps = pkg.dependencies || {};

          const EXCLUDE = new Set(['node_modules', '.git', 'dist', '.cache']);
          const IMPORT_RE = /^\s*import\s+.*\bfrom\s+['"]([^'"]+)['"]/gm;

          function jsFilesAtDepth(dir, depth) {
            if (depth === 0) return [];
            const files = [];
            for (const entry of readdirSync(dir)) {
              if (EXCLUDE.has(entry)) continue;
              const full = join(dir, entry);
              const stat = statSync(full);
              if (stat.isDirectory()) {
                files.push(...jsFilesAtDepth(full, depth - 1));
              } else if (stat.isFile() && entry.endsWith('.js')) {
                files.push(full);
              }
            }
            return files;
          }

          const files = jsFilesAtDepth('.', 2);
          const mismatches = [];

          for (const file of files) {
            const src = readFileSync(file, 'utf8');
            let m;
            IMPORT_RE.lastIndex = 0;
            while ((m = IMPORT_RE.exec(src)) !== null) {
              const spec = m[1];
              // Parse package name and version from import specifier.
              // Scoped packages: @scope/name[@version]
              // Unscoped packages: name[@version]
              let pkgName, version;
              if (spec.startsWith('@')) {
                const parts = spec.slice(1).split('@');
                pkgName = '@' + parts[0];
                version = parts[1];
              } else {
                const idx = spec.indexOf('@');
                pkgName = idx === -1 ? spec : spec.slice(0, idx);
                version = idx === -1 ? undefined : spec.slice(idx + 1);
              }

              if (!(pkgName in deps)) continue; // Not a tracked dependency; skip.

              const expected = deps[pkgName];
              if (!version) {
                mismatches.push(`${file}: '${spec}' has no version constraint (expected @${expected})`);
              } else if (version !== expected) {
                mismatches.push(`${file}: '${spec}' has version @${version} but package.json requires @${expected}`);
              }
            }
          }

          if (mismatches.length > 0) {
            console.error('Import version mismatches found:');
            for (const msg of mismatches) console.error(' -', msg);
            process.exit(1);
          } else {
            console.log('All import version constraints match package.json.');
          }
          EOF

  test:
    needs: check-import-versions
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        # Test against all LTS versions of Node (Active, Maintenance).
        # See <https://nodejs.org/en/about/releases/>

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Clean-install NPM dependencies
        run: npm ci

      - name: Test
        run: npm test
        env:
          TEST_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.TEST_GOOGLE_SERVICE_ACCOUNT_KEY }}
          TEST_GOOGLE_SHEET_ID: ${{ secrets.TEST_GOOGLE_SHEET_ID }}

  publish:
    name: Publish
    needs: test
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Clean-install NPM dependencies
        run: npm ci

      - name: Install Pipedream CLI
        run: curl https://cli.pipedream.com/install | sh

      - name: Configure Pipedream CLI
        run: |
          mkdir -p $HOME/.config/pipedream
          echo "api_key = ${{ secrets.PIPEDREAM_API_KEY }}" > $HOME/.config/pipedream/config
          echo "org_id = ${{ secrets.PIPEDREAM_WORKSPACE_ID }}" >> $HOME/.config/pipedream/config

      - name: Publish Actions to Pipedream
        run: |
          changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep '\.js$' | grep -v '\.test\.js$' || true)
          if [ -z "$changed_files" ]; then
            echo "No changed action files to publish." | tee -a $GITHUB_STEP_SUMMARY
          else
            for file in $changed_files; do
              pd publish $file
            done
            echo "Published: $changed_files" >> $GITHUB_STEP_SUMMARY
          fi
